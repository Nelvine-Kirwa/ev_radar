name: ev_radar
description: EV Radar - Smart Electric Vehicle Tracking and Charging Recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Location & GPS
  geolocator: 10.1.1
  geocoding: ^4.0.0

  # Maps
  google_maps_flutter: 2.5.3
  flutter_polyline_points: 2.0.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.0.0

  # Notifications
  flutter_local_notifications: 17.2.1

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: 2.2.2
  permission_handler: 11.2.0

  # Environment
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/chargers/

