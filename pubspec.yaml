name: ev_radar
description: EV Radar - Smart Electric Vehicle Tracking and Charging Recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Location & GPS
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Maps
  google_maps_flutter: ^2.5.3
  flutter_polyline_points: ^2.0.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.2
  firebase_auth: ^4.16.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.2.0

  # Environment
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/